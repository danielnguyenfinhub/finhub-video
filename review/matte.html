<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Background</title>
    <style>
      /* Brand colours from src/brand/theme.ts, as in index.html. */
      :root { --navy: #0b1f3d; --blue: #0064a8; --amber: #f5a524; --paper: #f6f1e4; --dim: #5b6b82; --good: #1e8a5a; --bad: #c8322b; }
      body { margin: 0; background: var(--paper); color: var(--navy); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
      main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p { color: var(--dim); margin: 0 0 16px; }
      button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; background: var(--blue); color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
      progress { width: 100%; height: 10px; margin: 16px 0 8px; accent-color: var(--blue); }
      .status { padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; }
      .status.info { background: #e6eef8; color: var(--blue); }
      .status.ok { background: #e3f4ec; color: var(--good); }
      .status.bad { background: #fbe6e5; color: var(--bad); }
    </style>
  </head>
  <body>
    <main>
      <h1>Remove background · <span id="slug"></span></h1>
      <p>Cuts you out of the video so edit.json <code>"background": "brand"</code> can put a brand background behind you. Takes about 13× the video's length; keep this window open until it says Saved.</p>
      <button id="run" disabled>Remove background</button>
      <progress id="bar" max="1" value="0"></progress>
      <div id="status" class="status info">Checking this browser…</div>
    </main>
    <script type="module" src="./matte.js"></script>
  </body>
</html>
