<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finance Hub · review &amp; tweak</title>
    <style>
      /* Brand colours from src/brand/theme.ts. */
      :root {
        --navy: #0b1f3d;
        --blue: #0064a8;
        --amber: #f5a524;
        --paper: #f6f1e4;
        --text: #0b1f3d;
        --dim: #5b6b82;
        --good: #1e8a5a;
        --bad: #c8322b;
      }
      body { margin: 0; background: var(--paper); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
      main { max-width: 1200px; margin: 0 auto; padding: 16px; }
      header { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
      h1 { font-size: 22px; margin: 0; color: var(--navy); }
      h2 { font-size: 16px; margin: 20px 0 4px; }
      .layout { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 24px; margin-top: 12px; align-items: start; }
      @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
      .player { background: #000; border-radius: 12px; overflow: hidden; position: sticky; top: 16px; }
      .panel label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 10px; font-weight: 600; }
      select, button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #c9cfd9; background: #fff; color: var(--text); }
      button { cursor: pointer; }
      button:hover:not(:disabled), select:hover { border-color: var(--blue); }
      button:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 1px; }
      button:disabled { opacity: 0.45; cursor: default; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { background: #fff; border-radius: 10px; padding: 8px 10px; margin: 0 0 6px; box-shadow: 0 1px 3px rgba(11, 31, 61, 0.12); }
      li select { margin-top: 6px; width: 100%; }
      .row { display: flex; align-items: center; gap: 8px; }
      .row .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row button:first-child { font-variant-numeric: tabular-nums; min-width: 64px; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; position: sticky; bottom: 0; background: var(--paper); padding: 10px 0; }
      .actions button:first-child { background: var(--blue); color: #fff; border-color: var(--blue); }
      .dim { color: var(--dim); margin: 0 0 8px; }
      .status { padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; font: inherit; margin: 12px 0 0; }
      .status.ok { background: #e3f4ec; color: var(--good); }
      .status.bad { background: #fbe6e5; color: var(--bad); }
      .status.info { background: #e6eef8; color: var(--blue); }
      .log { background: var(--navy); color: #e6eef8; padding: 10px; border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; max-height: 240px; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- staticFile() paths resolve under /public/, which the server maps to
         the repo's public/ folder. -->
    <script>
      window.remotion_staticBase = "/public";
    </script>
    <script src="./main.js"></script>
  </body>
</html>
